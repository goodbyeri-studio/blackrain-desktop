name: Electron CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Vendor locked Codex runtime
        shell: pwsh
        run: ../../scripts/vendor-electron-codex-runtime.ps1 -Force
      - name: Vendor locked Node runtime
        shell: pwsh
        run: ../../scripts/vendor-electron-node-runtime.ps1 -Force
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:host-boundary
      - run: npm run electron:runtime:verify
      - run: npm run electron:node-runtime:verify
      - run: npm run electron:browser-client:verify
      - run: npm run electron:package
