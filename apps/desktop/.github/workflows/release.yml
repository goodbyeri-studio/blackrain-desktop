name: Electron Windows Release

on:
  workflow_dispatch:

jobs:
  make:
    runs-on: windows-latest
    environment: windows-release
    env:
      BLACKRAIN_RELEASE_SIGNING: "1"
      BLACKRAIN_RELEASE_PUBLISHER: ${{ vars.BLACKRAIN_RELEASE_PUBLISHER }}
      BLACKRAIN_UPDATE_MANIFEST_URL: ${{ vars.BLACKRAIN_UPDATE_MANIFEST_URL }}
      BLACKRAIN_UPDATE_PUBLISHER: ${{ vars.BLACKRAIN_UPDATE_PUBLISHER }}
      BLACKRAIN_UPDATE_PUBLIC_KEY: ${{ secrets.BLACKRAIN_UPDATE_PUBLIC_KEY }}
      WINDOWS_CERTIFICATE_FILE: ${{ github.workspace }}\signing\blackrain-release.pfx
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - name: Materialize signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE_BASE64) { throw "缺少 WINDOWS_CERTIFICATE_BASE64" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:WINDOWS_CERTIFICATE_FILE) | Out-Null
          [IO.File]::WriteAllBytes($env:WINDOWS_CERTIFICATE_FILE, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
      - name: Vendor locked Codex runtime
        shell: pwsh
        run: ../../scripts/vendor-electron-codex-runtime.ps1 -Force
      - name: Vendor locked Node runtime
        shell: pwsh
        run: ../../scripts/vendor-electron-node-runtime.ps1 -Force
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run check:host-boundary
      - run: npm run electron:app-server:probe
      - run: npm run electron:make:release
      - name: Verify signed MSIX
        shell: pwsh
        run: |
          $msix = Get-ChildItem -Path out/electron/make/msix/x64 -Filter *.msix -File | Select-Object -Single
          & signtool.exe verify /pa $msix.FullName
          if ($LASTEXITCODE -ne 0) { throw "signtool verify 失败" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $msix.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: BlackRain-windows-msix
          path: apps/desktop/out/electron/**/*.msix
      - name: Remove signing material
        if: always()
        shell: pwsh
        run: Remove-Item -LiteralPath $env:WINDOWS_CERTIFICATE_FILE -Force -ErrorAction SilentlyContinue
