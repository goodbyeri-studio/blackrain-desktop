schema_version: 1
id: com.blackrain.fixture
name: Fixture 工作台
version: 0.1.0
publisher: blackrain-tests
description: 用于验证严格 Manifest contract。
license: MIT
target:
  domains: [fixture]
  roles: [tester]
  platforms:
    - os: windows
      arch: x86_64
  blackrain: ">=0.7.68"
skills:
  - path: skills/demo
plugins: []
dependencies: []
permissions:
  files:
    mode: user-selected-folders
  network:
    domains: []
  processes:
    spawn: []
tasks:
  source: tasks/tasks.yaml
validation:
  health: validation/health.yaml
  smoke: validation/smoke/basic.yaml
uninstall:
  preserve_user_projects: true
