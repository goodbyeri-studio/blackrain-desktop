<!-- BlackRain 注册验证码邮件模板。
     关键：用 {{ .Token }}（6 位验证码），不用 {{ .ConfirmationURL }}（桌面 App 无深链）。
     纯内联样式（邮件客户端不支持 <style>/外链）。配色呼应 2049 霓虹雨夜。 -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#0c0818;padding:40px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <tr>
    <td align="center">
      <table width="440" cellpadding="0" cellspacing="0" style="background:#161024;border:1px solid rgba(217,163,194,0.18);border-radius:16px;padding:36px 40px;">
        <tr>
          <td align="center" style="padding-bottom:8px;">
            <span style="font-size:26px;font-weight:700;letter-spacing:0.04em;color:#ece4ee;">BlackRain</span>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:24px;">
            <span style="font-size:13px;letter-spacing:0.14em;color:#d9a3c2;">新一代 working Agent</span>
          </td>
        </tr>
        <tr>
          <td style="font-size:14px;line-height:1.7;color:#a892b8;padding-bottom:20px;">
            你正在注册 BlackRain 账号。请在登录页填入以下验证码完成注册：
          </td>
        </tr>
        <tr>
          <td align="center" style="padding-bottom:20px;">
            <div style="font-size:34px;font-weight:700;letter-spacing:0.3em;color:#ece4ee;background:rgba(10,6,20,0.5);border:1px solid rgba(255,79,163,0.3);border-radius:12px;padding:18px 0;">{{ .Token }}</div>
          </td>
        </tr>
        <tr>
          <td style="font-size:12.5px;line-height:1.6;color:#7c6a8c;">
            验证码 1 小时内有效。若非你本人操作，请忽略此邮件。
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
