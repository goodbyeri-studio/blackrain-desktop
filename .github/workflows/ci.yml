name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      gateway: ${{ steps.filter.outputs.gateway }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Route checks by changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          js=false
          gateway=false
          docs=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            js=true
            gateway=true
            docs=true
          else
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|.github/workflows/windows-checks.yml|apps/desktop/electron/**|apps/desktop/forge.config.*|apps/desktop/package.json|apps/desktop/package-lock.json|apps/desktop/resources/**|apps/desktop/tsconfig*.json|apps/desktop/vite*.config.*|apps/desktop/vitest.config.*|apps/desktop/eslint.config.*|apps/desktop/src/**|apps/desktop/scripts/**|scripts/vendor-electron-codex-runtime.ps1)
                  js=true
                  ;;
              esac
              case "$file" in
                .github/workflows/ci.yml|.github/workflows/windows-checks.yml|gateway/**|scripts/dev-client.ps1)
                  gateway=true
                  ;;
              esac
              case "$file" in
                *.md|docs/**|.github/ISSUE_TEMPLATE/**|.github/pull_request_template.md|.github/workflows/ci.yml|scripts/check-doc-links.mjs)
                  docs=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  docs-checks:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/check-doc-links.mjs

  js-checks:
    name: JS checks (Linux)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run electron:runtime:check-lock
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run lint:ds
      - run: npm run check:host-boundary
      - run: npm run codemod:ds:dry

  gateway-checks:
    name: Gateway checks
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s gateway -p 'test_gateway*.py' -v

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [changes, docs-checks, js-checks, gateway-checks]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate routed checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs-checks.result }}
          JS_RESULT: ${{ needs.js-checks.result }}
          GATEWAY_RESULT: ${{ needs.gateway-checks.result }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          JS_REQUIRED: ${{ needs.changes.outputs.js }}
          GATEWAY_REQUIRED: ${{ needs.changes.outputs.gateway }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$DOCS_REQUIRED" == "true" ]]; then
            test "$DOCS_RESULT" = success
          fi
          if [[ "$JS_REQUIRED" == "true" ]]; then
            test "$JS_RESULT" = success
          fi
          if [[ "$GATEWAY_REQUIRED" == "true" ]]; then
            test "$GATEWAY_RESULT" = success
          fi
