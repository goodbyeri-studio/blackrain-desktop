name: CI

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.docx"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - apps/desktop/src-tauri/Cargo.lock

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      js: ${{ steps.filter.outputs.js }}
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Route checks by changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          js=false
          rust=false
          gateway=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            js=true
            rust=true
            gateway=true
          else
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|apps/desktop/electron/*|apps/desktop/forge.config.*|apps/desktop/package.json|apps/desktop/package-lock.json|apps/desktop/tsconfig*.json|apps/desktop/vite*.config.*|apps/desktop/vitest.config.*|apps/desktop/eslint.config.*|apps/desktop/src/*|apps/desktop/scripts/*)
                  js=true
                  ;;
              esac
              case "$file" in
                .gitattributes|.github/workflows/ci.yml|apps/desktop/src-tauri/*|gateway/*|plugins/*|workbenches/*|scripts/check-windows-rust.ps1|scripts/release-client-win.ps1)
                  rust=true
                  ;;
              esac
              case "$file" in
                .github/workflows/ci.yml|gateway/*|scripts/dev-client.sh|scripts/dev-client.ps1)
                  gateway=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"

  js-checks:
    name: JS checks (Ubuntu)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run lint
      - run: npm run lint:ds
      - run: npm run check:host-boundary
      - run: npm run codemod:ds:dry

  windows-electron-artifacts:
    name: Windows Electron artifacts
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npm run electron:package
      - run: npm --ignore-scripts run electron:smoke
      - run: npm --ignore-scripts run electron:e2e
      - run: npm run electron:make

  gateway-checks:
    name: Gateway checks
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s gateway -p 'test_gateway*.py' -v

  windows-rust-checks:
    name: Windows Rust checks
    needs: changes
    if: >-
      needs.changes.outputs.rust == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ vars.WINDOWS_RUNNER || 'windows-latest' }}
    timeout-minutes: 35
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          cache-on-failure: true
      - name: Run Windows Rust checks
        shell: pwsh
        run: pwsh -NoProfile -File scripts/check-windows-rust.ps1
