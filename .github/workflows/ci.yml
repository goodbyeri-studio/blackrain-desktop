name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22.23.2"

jobs:
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
      gateway: ${{ steps.filter.outputs.gateway }}
      js: ${{ steps.filter.outputs.js }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        name: Route checks by changed paths
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          js=false
          gateway=false
          docs=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            js=true
            gateway=true
            docs=true
          else
            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml|apps/desktop/electron/**|apps/desktop/forge.config.*|apps/desktop/package.json|apps/desktop/package-lock.json|apps/desktop/resources/**|apps/desktop/tsconfig*.json|apps/desktop/vite*.config.*|apps/desktop/vitest.config.*|apps/desktop/eslint.config.*|apps/desktop/src/**|apps/desktop/scripts/**)
                  js=true
                  ;;
              esac
              case "$file" in
                .github/workflows/ci.yml|gateway/**)
                  gateway=true
                  ;;
              esac
              case "$file" in
                *.md|docs/**|.github/ISSUE_TEMPLATE/**|.github/pull_request_template.md|.github/workflows/ci.yml|scripts/check-doc-links.mjs)
                  docs=true
                  ;;
              esac
            done < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi

          echo "js=$js" >> "$GITHUB_OUTPUT"
          echo "gateway=$gateway" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"

  # 主检查跑在 macOS：那是唯一的产品发布目标，也是唯一会暴露
  # 平台相关问题（Unix socket 路径长度、大小写敏感、路径分隔符）的环境。
  js-checks:
    name: JS checks (macOS)
    needs: changes
    if: needs.changes.outputs.js == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/desktop
    env:
      # macOS 默认 TMPDIR 是 /var/folders/<hash>/T/，加上 Browser transport 的
      # socket 文件名会超过 Unix domain socket sun_path 的 104 字节上限，
      # 导致相关测试报 listen EINVAL。显式指定短路径，不依赖 runner 默认值。
      TMPDIR: /tmp/br
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: mkdir -p /tmp/br
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run check:host-boundary
      - run: npm run codemod:ds:dry
      # 只校验 runtime lock 的完整性；不校验 vendored 二进制（那是 Windows
      # 制品，macOS 上不存在，且当前不构建也不发行 Windows 客户端）。
      - run: npm run electron:runtime:check-lock
      - run: npm run electron:node-runtime:check-lock
      - run: npm run electron:browser-client:verify
      # renderer 构建能捕获 vite 配置、别名和 import 层面的问题，约 1 秒。
      - run: npm run build

  docs-checks:
    name: Documentation checks
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-doc-links.mjs

  gateway-checks:
    name: Gateway checks
    needs: changes
    if: needs.changes.outputs.gateway == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s gateway -p 'test_gateway*.py' -v

  quality-gate:
    name: Required quality gate
    if: always()
    needs: [changes, docs-checks, js-checks, gateway-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate routed checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          DOCS_RESULT: ${{ needs.docs-checks.result }}
          JS_RESULT: ${{ needs.js-checks.result }}
          GATEWAY_RESULT: ${{ needs.gateway-checks.result }}
          DOCS_REQUIRED: ${{ needs.changes.outputs.docs }}
          JS_REQUIRED: ${{ needs.changes.outputs.js }}
          GATEWAY_REQUIRED: ${{ needs.changes.outputs.gateway }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$DOCS_REQUIRED" == "true" ]]; then
            test "$DOCS_RESULT" = success
          fi
          if [[ "$JS_REQUIRED" == "true" ]]; then
            test "$JS_RESULT" = success
          fi
          if [[ "$GATEWAY_REQUIRED" == "true" ]]; then
            test "$GATEWAY_RESULT" = success
          fi
