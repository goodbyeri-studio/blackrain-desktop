name: Windows checks

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "gateway/**"
      - "scripts/**"
      - ".github/workflows/windows-checks.yml"
      - "package*.json"
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "gateway/**"
      - "scripts/**"
      - ".github/workflows/windows-checks.yml"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Electron desktop checks
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm.cmd ci
      - run: npm.cmd run typecheck
      - run: npm.cmd run test
      - run: npm.cmd run lint
      - run: npm.cmd run check:host-boundary
      - run: npm.cmd run electron:runtime:check-lock
      - run: npm.cmd run electron:node-runtime:check-lock
      - run: npm.cmd run electron:browser-client:verify
