version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - javascript
    # 把零散的版本 bump 聚合成一个 PR，减少小团队的 review 负担。
    groups:
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript-eslint"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "globals"
          - "@eslint/*"
        update-types:
          - minor
          - patch
      runtime-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # 以下版本上限由工具链兼容性决定，不能由 dependabot 自动跨越：
      # - eslint 9.x：eslint-plugin-react 的 peer 上限是 ^9.7，且在
      #   ESLint 10 上有未修复的运行时崩溃。
      # - typescript 5.9.x：typescript-eslint 8 的 peer 上限是 <6.1.0，
      #   而 npm 上 typescript@latest 已是 7.x。
      # - electron：主版本升级需要同步核对 Node ABI、node-pty 预编译产物
      #   和 app-server 集成，必须人工验证。
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: electron
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-plugin-react
        update-types: ["version-update:semver-major"]
      # React 主版本升级需要人工评估。
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
