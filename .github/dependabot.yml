version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # 运行时只聚合低风险补丁更新；运行时 minor 更新保持单包 PR，避免把
    # 破坏性 API 变化藏在一个大型依赖升级中。开发工具仍按下方专组聚合。
    groups:
      runtime-patches:
        patterns:
          - "@sentry/react"
          - "@tanstack/react-virtual"
          - "lucide-react"
          - "prismjs"
          - "react-markdown"
          - "remark-gfm"
        update-types:
          - patch
      dev-tooling:
        patterns:
          - "@types/*"
          - "eslint*"
          - "typescript-eslint"
          - "vite"
          - "vitest"
          - "@vitejs/*"
          - "globals"
          - "@eslint/*"
        update-types:
          - minor
          - patch
    ignore:
      # 主版本升级统一人工处理，避免 Electron、原生模块、UI 库或工具链
      # 的破坏性变化进入自动 review 队列。
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 以下 minor 版本也受工具链兼容性约束：
      # - typescript 5.9.x：typescript-eslint 8 的 peer 上限是 <6.1.0，
      #   而 npm 上 typescript@latest 已是 7.x。
      - dependency-name: typescript
        update-types: ["version-update:semver-minor"]
      # 1.3.x 移除了当前 diff viewer 使用的 metadata 与 hover API，
      # 需要单独做应用代码适配，不能作为自动依赖维护合并。
      - dependency-name: "@pierre/diffs"
        update-types: ["version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns:
          - "*"
